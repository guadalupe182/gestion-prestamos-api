openapi: 3.0.0
info:
  title: API Gestión de Préstamos (Gdev)
  description: API REST para administrar clientes y préstamos en memoria.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local
paths:
  /clientes:
    get:
      summary: Obtener todos los clientes
      responses:
        '200':
          description: Lista de clientes exitosa
    post:
      summary: Crear un nuevo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                email: { type: string }
                edad: { type: integer }
                tipoCliente: { type: string, enum: [REGULAR, VIP] }
      responses:
        '201':
          description: Cliente creado exitosamente

  /prestamos/activos:
    get:
      summary: Obtener préstamos con estado PENDIENTE
      responses:
        '200':
          description: Lista de préstamos activos

  /prestamos/{id}/total-pagar:
    get:
      summary: Calcular el monto total a pagar con intereses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cálculo realizado correctamente

  /loans:
    get:
      summary: Listar préstamos del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de préstamos del tenant autenticado
    post:
      summary: Crear un préstamo JPA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        '201':
          description: Préstamo creado

  /loans/{id}:
    get:
      summary: Obtener un préstamo por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Préstamo encontrado
        '403':
          description: El préstamo no pertenece al usuario
    put:
      summary: Actualizar un préstamo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        '200':
          description: Préstamo actualizado
    delete:
      summary: Eliminar un préstamo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Préstamo eliminado

  /loans/{id}/calculate-interest:
    get:
      summary: Calcular interés simple de un préstamo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interés calculado

  /auth/register:
    post:
      summary: Registrar usuario validando licencia GDEV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado y token JWT emitido
  /auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT emitido

  /loans/{loanId}/payments:
    post:
      summary: Registrar un pago para un préstamo
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Pago registrado correctamente
    get:
      summary: Obtener el historial de pagos de un préstamo
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historial de pagos

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [username, password, licenseKey]
      properties:
        username: { type: string }
        password: { type: string }
        licenseKey: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    PaymentRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: double, minimum: 0.01 }
        paymentDate: { type: string, format: date }
    LoanRequest:
      type: object
      required: [clientId, amount, tenantId]
      properties:
        clientId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0.01 }
        interestRate: { type: number, format: double }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string }
        tenantId: { type: string, description: "Ignorado por el servidor; se usa el del JWT" }
