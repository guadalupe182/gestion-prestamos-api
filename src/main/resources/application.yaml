spring:
  application:
    name: gestion-prestamos-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:gdevloans;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

gdev:
  crm:
    license-validation-url: ${GDEV_LICENSE_VALIDATION_URL:https://api.gdevsoftware.com/api/v1/licenses/validate/{key}}

jwt:
  secret: ${JWT_SECRET:Z2Rldi1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQtZm9yLWxvYW4tYXBpLTIwMjY=}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}